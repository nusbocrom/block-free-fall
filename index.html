<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ブロック自由落下</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f4efe6; overflow: hidden; }
    /* 縦長スマホ想定。PCでは中央に縦長(9:16)で表示する */
    #frame { position: absolute; inset: 0; margin: 0 auto; max-width: calc(100vh * 9 / 16); }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #f4efe6; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; color: #333; gap: 12px; }
    #bar { width: 60%; height: 10px; background: #ddd5c5; border-radius: 5px; overflow: hidden; }
    #bar > div { width: 0; height: 100%; background: #333; }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div>読み込み中…</div><div id="bar"><div></div></div></div>
  </div>
  <script src="Build/WebGL.loader.js"></script>
  <script>
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/WebGL.data",
      frameworkUrl: "Build/WebGL.framework.js",
      codeUrl: "Build/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "KusogeDev",
      productName: "ブロック自由落下",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    }, (progress) => {
      document.querySelector("#bar > div").style.width = (progress * 100) + "%";
    }).then(() => {
      document.querySelector("#loading").remove();
    }).catch((message) => {
      document.querySelector("#loading").textContent = "起動に失敗しました: " + message;
    });
  </script>
</body>
</html>
