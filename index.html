<!DOCTYPE html>
<html lang="ja">
<head>

<title>ブロック自由落下</title>
<style>
  :root { --bg: #f4efe6; --text: #333; --panel: #ddd5c5; --btn: #fff; --btnText: #333; --btnShadow: #a99;
    --over: rgba(244,239,230,.94); --strong: #333; --strongText: #fff; --track: rgba(0,0,0,.18); --subtle: rgba(0,0,0,.12); }
  html[data-theme="dark"] { --bg: #15171c; --text: #e8e8ea; --panel: #222630; --btn: #363c4a; --btnText: #e8e8ea;
    --btnShadow: #0c0d10; --over: rgba(21,23,28,.94); --strong: #e8e8ea; --strongText: #15171c;
    --track: rgba(255,255,255,.25); --subtle: rgba(255,255,255,.14); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; touch-action: none;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; user-select: none; -webkit-user-select: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { width: 100%; height: 100%; display: block; }
  #hud { position: absolute; top: 8px; left: 12px; right: 12px; display: flex; justify-content: space-between;

  #hScore { white-space: pre-line; line-height: 1.4; }
  #btns { display: flex; gap: 4px; align-items: flex-start; }
  #warn { position: absolute; left: 0; right: 0; top: 28%; height: 84px; display: none; align-items: center;

    background: repeating-linear-gradient(-45deg, #fc0 0 22px, #222 22px 44px); animation: blink .35s steps(2) infinite; }
  #warn span { background: #222; color: #fc0; font-size: 26px; font-weight: bold; padding: 6px 18px; letter-spacing: 2px; }
  @keyframes blink { 50% { opacity: .35; } }

  #controls { display: flex; gap: 8px; padding: 8px; background: var(--panel); }
  #controls button { flex: 1; font-size: 26px; padding: 14px 0; border: 0; border-radius: 10px; background: var(--btn); color: var(--btnText);
    box-shadow: 0 3px 0 var(--btnShadow); touch-action: none; }
  #controls button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--btnShadow); }
  #over { position: absolute; inset: 0; background: var(--over); color: var(--text); display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; }
  #over h1 { margin: 0; font-size: 30px; }
  #over .big { font-size: 48px; font-weight: bold; }
  #over button { font-size: 20px; padding: 12px 28px; border: 0; border-radius: 10px; background: var(--strong); color: var(--strongText); }
  #over button#revive { background: #fc0; color: #222; font-weight: bold; box-shadow: 0 3px 0 #a80; }
  #over button.sub { background: var(--btn); color: var(--btnText); box-shadow: 0 2px 0 var(--btnShadow); }
  #adslot { min-height: 0; }
  #adDummy { position: absolute; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; background: rgba(0,0,0,.82); color: #fff; font-weight: bold; text-align: center; }
  #adDummy .n { font-size: 56px; }
  #adDummy small { font-weight: normal; opacity: .7; }
  #overBg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .4; pointer-events: none; }
  #over > *:not(canvas) { position: relative; }
  #rot { position: absolute; right: 6px; top: 14%; bottom: 6%; width: 56px; touch-action: none; }
  #rotTrack { position: absolute; left: 50%; top: 0; bottom: 0; width: 10px; margin-left: -5px;
    border-radius: 5px; background: var(--track); }
  #rotThumb { position: absolute; left: 50%; width: 52px; height: 36px; margin: -18px 0 0 -26px; border-radius: 18px;
    background: var(--strong); color: var(--strongText); font-size: 14px; font-weight: bold; display: flex; align-items: center;
    justify-content: center; box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  #rotMark { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--track); }
  #howto { position: absolute; inset: 0; z-index: 8; display: none; background: rgba(0,0,0,.72); color: #fff;
    font-weight: bold; text-align: center; }
  #howto .h { position: absolute; left: 24px; right: 24px; font-size: 18px; line-height: 1.5; }
  #howto .h b { color: #fc0; }
  #hMove { top: 22%; }
  #hSlider { top: 38%; right: 76px; left: 24px; text-align: right; }
  #stage.lefty #hSlider { left: 76px; right: 24px; text-align: left; }
  #hDrop { bottom: 14px; }
  #hStart { position: absolute; left: 0; right: 0; top: 62%; font-size: 15px; opacity: .85; }
  .side { display: none; position: fixed; top: 24px; width: 240px; font-size: 14px; line-height: 1.7; color: var(--text); }
  #sideL { left: 24px; } #sideR { right: 24px; }
  .side h1 { margin: 0 0 4px; font-size: 24px; }
  .side h2 { margin: 18px 0 4px; font-size: 14px; opacity: .7; }
  .side kbd { display: inline-block; min-width: 1.6em; padding: 0 6px; border-radius: 5px; background: var(--btn);
    box-shadow: 0 2px 0 var(--btnShadow); text-align: center; font-family: inherit; font-size: 12px; }
  .side a { color: inherit; font-weight: bold; }
  .rec #btns { display: none; }
  /* PC: 縦長(9:16)の枠で中央に表示。縦型動画の撮影にもそのまま使える */
  @media (min-width: 900px) {
    #app { max-width: none; width: min(520px, calc(100vh * 9 / 16)); border-radius: 14px; overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,.28); }
  }
  @media (min-width: 1100px) { .side { display: block; } }
</style>
</head>
<body>

  <div><a href="https://x.com/search?q=%23%E3%83%96%E3%83%AD%E3%83%83%E3%82%AF%E8%87%AA%E7%94%B1%E8%90%BD%E4%B8%8B&amp;src=typed_query&amp;f=top" target="_blank" rel="noopener">#ブロック自由落下</a> をXで見る</div>

<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud"><span id="hScore">高さ 0m</span><span id="btns"><button id="hand">回転:右</button><button id="mute">🔊</button><button id="theme">🌙</button><button id="help">？</button></span><span id="hLife"></span></div>
    <div id="msg"></div>
    <div id="warn"><span>⚠ 注意 ⚠ 何かが来る</span></div>
    <div id="rot"><div id="rotTrack"></div><div id="rotMark"></div><div id="rotThumb">0°</div></div>
    <div id="adDummy"><div>広告(ダミー)</div><div class="n" id="adN">3</div><small>終わると、直前に戻ります</small></div>

      <!-- 広告の差し込み口(将来: リワード広告「復活」やバナーをここに) -->

      <button id="retry">もう一回</button>

      <button id="tagsearch" class="sub">みんなの記録を見る</button>
    </div>

    <button id="bDrop">⬇</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
// ===== 調整用パラメータ(ここをいじると理不尽さが変わる) =====
const CFG = {
  gravity: 0.9,          // 重力
  maxFallSpeed: 9,       // 落下速度の上限(大きいほど着地の衝撃が強い)
  friction: 0.15,        // 摩擦(小さいほど滑る)
  frictionStatic: 0.3,
  restitution: 0.1,      // 反発(大きいほど跳ねる)
  density: 0.0012,
  block: 30,             // 1マスの大きさ
  bowlHalfWidth: 150,    // お椀の半幅
  bowlRise: 30,          // お椀の縁の高さ(大きいほど急で中央に寄る)
  bossHeight: 5,         // この高さ(m)に達すると「終わらせにかかる」物体が来る
  bossWeight: 1.5,       // 変な物体の重い部分の密度倍率(大きいほど塔を壊す)
  bossInterval: 4,       // 以降は、この高さ(m)ごとに来る
  interstitialEvery: 10,  // ゲーム間の広告を挟む頻度(何回に1回)
  warnFrames: 110,       // 注意の帯を出してから物体が出るまでのフレーム数
  lives: 3,              // 落としていい回数
  settleFrames: 45,      // 静止とみなすフレーム数
  maxWaitMs: 7000,       // 静止しなくても次を出すまでの時間
  rotStep: 10,           // 回転スライダーの刻み(度)
  wobble: 0.0006         // 着地時にランダムに加える回転の揺れ(理不尽さ)
};

const { Engine, Bodies, Body, Composite, Events, Query } = Matter;
const W = 400;               // ワールドの基準幅
const GROUND_Y = 0;          // 土台の上面
const SHAPES = {
  I: { cells: [[-1.5,0],[-0.5,0],[0.5,0],[1.5,0]], color: '#4ac' },
  O: { cells: [[-0.5,-0.5],[0.5,-0.5],[-0.5,0.5],[0.5,0.5]], color: '#eb3' },
  T: { cells: [[-1,0],[0,0],[1,0],[0,-1]], color: '#a6c' },
  S: { cells: [[-1,0],[0,0],[0,-1],[1,-1]], color: '#5b6' },
  Z: { cells: [[-1,-1],[0,-1],[0,0],[1,0]], color: '#e55' },
  J: { cells: [[-1,-1],[-1,0],[0,0],[1,0]], color: '#58d' },
  L: { cells: [[1,-1],[-1,0],[0,0],[1,0]], color: '#e92' }
};
const KEYS = Object.keys(SHAPES);

// URLの付け足し: ?rec = ボタン類を隠す(画面録画向け)、?boss=1 = 変な物体を指定の高さ(m)で呼ぶ(動画撮影向け)
{
  const q = new URLSearchParams(location.search);
  if (q.has('rec')) document.documentElement.classList.add('rec');
  const bq = parseFloat(q.get('boss'));
  if (bq > 0) CFG.bossHeight = bq;
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

let engine, platform, held, pieces, lives, score, best, state, scale, targetScale, cw, ch, dpr;
let settleCount, droppedAt, current, msgTimer;
let bowlPts, bossPending, nextBoss, spawnDelay;
let snap, usedRevive;
let peakScore, peakCount, count, peakShot;
best = Number(safeGet('bff-best')) || 0;

function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function resize() {
  dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  cw = r.width; ch = r.height;
  canvas.width = cw * dpr; canvas.height = ch * dpr;
}
window.addEventListener('resize', resize);

function baseScale() { return cw / W; }
function viewScale(h) { return Math.min(baseScale(), ch / (h + 420)); }
function sx(x) { return cw / 2 + (x - W / 2) * scale; }
function sy(y) { return ch - 50 * scale + (y - GROUND_Y) * scale; }
function wx(px) { return (px - cw / 2) / scale + W / 2; }
function topY() { return GROUND_Y + 50 - ch / scale; }   // 画面上端のワールドy

function makePiece(key) {
  const B = CFG.block, s = SHAPES[key];
  const parts = s.cells.map(([cx, cy]) => Bodies.rectangle(cx * B, cy * B, B, B, {
    friction: CFG.friction, frictionStatic: CFG.frictionStatic, restitution: CFG.restitution,
    density: CFG.density, frictionAir: 0.001
  }));
  const body = Body.create({ parts, friction: CFG.friction, frictionStatic: CFG.frictionStatic,
    restitution: CFG.restitution });
  body.color = s.color;
  return body;
}

function reset() {
  engine = Engine.create();
  engine.gravity.y = CFG.gravity;
  Events.on(engine, 'collisionStart', e => Sound.collide(e.pairs));
  engine.positionIterations = 8;
  buildBowl();
  bossPending = false; nextBoss = CFG.bossHeight; spawnDelay = 0;
  snap = null; usedRevive = false;
  peakScore = 0; peakCount = 0; count = 0; peakShot = null;
  pieces = []; lives = CFG.lives; score = 0; held = null; current = null;
  scale = targetScale = baseScale();
  state = 'play';
  $('over').style.display = 'none';
  updateHud();
  spawn();
  Ads.gameplayStart();
}

// なだらかなお椀: 中央がGROUND_Y、縁が bowlRise だけ高い放物線を、短い板の連続で作る
function buildBowl() {
  const n = 20, pts = [];
  for (let i = 0; i <= n; i++) {
    const u = -1 + 2 * i / n;
    pts.push({ x: W / 2 + u * CFG.bowlHalfWidth, y: GROUND_Y - CFG.bowlRise * u * u });
  }
  bowlPts = pts;
  const T = 30;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    const cx = (a.x + b.x) / 2 - dy / len * T / 2, cy = (a.y + b.y) / 2 + dx / len * T / 2;
    Composite.add(engine.world, Bodies.rectangle(cx, cy, len + 6, T, {
      isStatic: true, angle: Math.atan2(dy, dx),
      friction: CFG.friction, frictionStatic: CFG.frictionStatic, restitution: 0.1 }));
  }
}

// 終わらせにかかる変な形の物体
function makeBoss(idx) {
  const base = { friction: CFG.friction, frictionStatic: CFG.frictionStatic, restitution: CFG.restitution };
  const light = { ...base, density: CFG.density }, heavy = { ...base, density: CFG.density * CFG.bossWeight };
  const kinds = [
    () => Body.create({ parts: [                       // 0: 片側だけ重いダンベル
      Bodies.rectangle(0, 0, 220, 16, light), Bodies.circle(-110, 0, 30, heavy), Bodies.circle(110, 0, 16, light)] }),
    () => Body.create({ parts: [0, 60, 120].map(d =>    // 1: トゲトゲの星
      Bodies.rectangle(0, 0, 170, 18, { ...light, angle: d * Math.PI / 180 })) }),
    () => Bodies.polygon(0, 0, 3, 56, heavy),           // 2: 巨大三角
    () => Bodies.circle(0, 0, 38, heavy)                // 3: 転がる鉄球
  ];
  const b = kinds[idx !== undefined ? idx : Math.floor(Math.random() * kinds.length)]();
  b.color = '#2a2d38';   // 通常ピースの7色と被らない、ほぼ黒
  return b;
}

// 確認用(手元のみ): URLに ?debug を付けると、各形を呼び出すボタンが出る
const DEBUG_BOSS = ['ダンベル', '星', '三角', '鉄球'];
function debugSwap(make) {
  if (!held || state !== 'play') return;
  Composite.remove(engine.world, held);
  held = make();
  Body.setStatic(held, true);
  Body.setPosition(held, { x: W / 2, y: topY() + 60 });
  Composite.add(engine.world, held);
  setRot(0);
}
// 公開版(https)では無効。手元のファイルやlocalhostで開いたときだけ使える
const IS_LOCAL = location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
if (IS_LOCAL && /[?&]debug/.test(location.search)) {
  const box = document.createElement('div');
  box.style.cssText = 'position:absolute;top:34px;left:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:70%;z-index:6';
  const add = (label, make) => {
    const b = document.createElement('button');
    b.textContent = label; b.style.cssText = 'font-size:12px;padding:4px 8px;border:0;border-radius:6px;background:#fff';
    b.addEventListener('click', () => debugSwap(make)); box.appendChild(b);
  };
  DEBUG_BOSS.forEach((n, i) => add(n, () => makeBoss(i)));
  KEYS.forEach(k => add(k, () => makePiece(k)));
  document.addEventListener('DOMContentLoaded', () => $('stage').appendChild(box));
  if (document.readyState !== 'loading') $('stage').appendChild(box);
}

function showWarning() {
  Sound.warning();
  $('warn').style.display = 'flex';
  setTimeout(() => { $('warn').style.display = 'none'; }, CFG.warnFrames * 1000 / 60);
}

function spawn() {
  if (bossPending) {
    held = makeBoss(); bossPending = false; nextBoss = score + CFG.bossInterval;
    flash('なんか来た');
    Sound.boss();
  } else {
    held = makePiece(KEYS[Math.floor(Math.random() * KEYS.length)]);
  }
  Body.setStatic(held, true);
  Body.setPosition(held, { x: W / 2, y: topY() + 60 });
  Composite.add(engine.world, held);
  setRot(0);
}

// 「直前に戻る」用: ピースを落とす直前の状態を覚えておく
function takeSnapshot() {
  snap = {
    items: pieces.map(p => ({ body: p, pos: { x: p.position.x, y: p.position.y }, angle: p.angle,
      vel: { x: p.velocity.x, y: p.velocity.y }, angVel: p.angularVelocity })),
    dropped: held, x: held.position.x, rotDeg, lives, bossPending, nextBoss
  };
}

function restoreSnapshot() {
  const sn = snap;
  for (const p of pieces) Composite.remove(engine.world, p);
  if (held) Composite.remove(engine.world, held);
  for (const it of sn.items) {
    const p = it.body;
    Composite.add(engine.world, p);
    Body.setPosition(p, it.pos); Body.setAngle(p, it.angle);
    Body.setVelocity(p, it.vel); Body.setAngularVelocity(p, it.angVel);
  }
  pieces = sn.items.map(it => it.body);
  current = null; spawnDelay = 0;
  // 落とす直前だったピースを、元の位置・向きで持たせ直す
  held = sn.dropped;
  Composite.remove(engine.world, held);
  Body.setVelocity(held, { x: 0, y: 0 }); Body.setAngularVelocity(held, 0);
  Body.setStatic(held, true);
  Body.setPosition(held, { x: sn.x, y: topY() + 60 });
  Composite.add(engine.world, held);
  setRot(sn.rotDeg);
  lives = Math.min(CFG.lives, sn.lives + 1);
  bossPending = sn.bossPending; nextBoss = sn.nextBoss;
  usedRevive = true; state = 'play';
  $('over').style.display = 'none';
  updateHud(); flash('もう一回！');
  Sound.revive();
  Ads.gameplayStart();
}

// ===== 広告の受け口 =====
// ゲーム側は Ads.* だけを呼ぶ。配信サイト(Poki、CrazyGamesなど)のSDKに合わせて provider を差し替える。
//   gameplayStart / gameplayStop : 遊び始め・遊び終わり(サイトによっては必須の通知)
//   interstitial(done)           : ゲーム間の広告。終わったら done() を呼ぶ
//   rewarded(onReward, onNoAd)   : 見終わったら onReward()、出せなければ onNoAd() を呼ぶ
// SDKの呼び方の例(いずれも投稿先の最新の公式資料で要確認):
//   Poki       : PokiSDK.gameplayStart() / gameplayStop() / commercialBreak() / rewardedBreak()
//   CrazyGames : CrazyGames.SDK.game.gameplayStart() / .ad.requestAd('midgame' | 'rewarded', {adFinished, adError})
const dummyProvider = {
  gameplayStart() {}, gameplayStop() {},
  interstitial(done) { done(); },                 // ダミーは何も出さない
  rewarded(onReward) { showRewardedAd(onReward); }
};
const Ads = {
  provider: dummyProvider,
  games: 0,
  gameplayStart() { try { this.provider.gameplayStart(); } catch (e) {} },
  gameplayStop() { try { this.provider.gameplayStop(); } catch (e) {} },
  // 「もう一回」の前: 数回に1回だけ、ゲーム間の広告を挟む
  beforeRetry(next) {
    this.games++;
    if (this.games % CFG.interstitialEvery !== 0) return next();
    Sound.adPlaying(true);
    const n = () => { Sound.adPlaying(false); next(); };
    try { this.provider.interstitial(n); } catch (e) { n(); }
  },
  rewarded(onReward, onNoAd) {
    Sound.adPlaying(true);
    const done = f => (...a) => { Sound.adPlaying(false); f && f(...a); };
    try { this.provider.rewarded(done(onReward), done(onNoAd)); } catch (e) { done(onNoAd)(); }
  }
};

function dropHeld() {
  if (state !== 'play' || !held) return;
  takeSnapshot();
  Sound.drop();

}

function moveHeld(dx) {
  if (!held) return;
  setHeldX(held.position.x + dx);
}
function setHeldX(x) {
  if (!held) return;
  Body.setPosition(held, { x, y: held.position.y });
  // はみ出し防止(外接矩形で判定するので、大きな物体や回転後でも画面内に収まる)
  const b = held.bounds;
  if (b.min.x < 0) Body.translate(held, { x: -b.min.x, y: 0 });
  else if (b.max.x > W) Body.translate(held, { x: W - b.max.x, y: 0 });
}
// 回転スライダー(縦)。上=-180°、中央=0°、下=+180°。刻みは CFG.rotStep
let rotDeg = 0;
function setRot(deg) {
  rotDeg = deg;
  if (held) { Body.setAngle(held, deg * Math.PI / 180); setHeldX(held.position.x); }
  const f = (deg + 180) / 360;
  $('rotThumb').style.top = (f * 100) + '%';
  $('rotThumb').textContent = deg + '°';
}
function rotateHeld(dir) {       // 1刻み(CFG.rotStep)ずつ回す。端は一周してつながる
  let d = rotDeg + dir * CFG.rotStep;
  if (d > 180) d -= 360; if (d < -180) d += 360;
  setRot(d);
}

// 塔の高さと乗っている個数。動いている最中のピースは数えない(跳ねた一瞬を最高記録にしないため)
function towerStats() {
  let top = GROUND_Y;
  for (const p of pieces) {
    if (!settled(p)) continue;
    if (p.position.y > GROUND_Y + 150) continue;
    top = Math.min(top, p.bounds.min.y);
  }
  // 個数: お椀の真上(幅=お椀、高さ=上方向すべて)の範囲と重なるピース。雑でOK
  const bowlRegion = { min: { x: W / 2 - CFG.bowlHalfWidth, y: -1e6 }, max: { x: W / 2 + CFG.bowlHalfWidth, y: GROUND_Y + 60 } };
  const n = Query.region(pieces, bowlRegion).length;
  return { h: Math.max(0, Math.round((GROUND_Y - top) / CFG.block * 0.5 * 10) / 10), n };  // 1マス=0.5m
}
// 最高到達時のピースの形(頂点)だけを覚える。数百個の数字なので軽い。画像にするのはシェアを押したとき
function recordPeak() {
  peakShot = pieces.filter(p => p.position.y <= GROUND_Y + 150).map(p => ({
    color: p.color,
    polys: (p.parts.length > 1 ? p.parts.slice(1) : [p]).map(q => q.vertices.map(v => [v.x, v.y]))
  }));
}

// 最高到達時の塔とお椀を、area に収まるように描く(シェア画像と結果画面の背景で共用)
function renderPeak(g, area, maxK, lw) {
  // 塔とお椀が収まる範囲を求めて、下をそろえて拡大する
  let minX = W / 2 - CFG.bowlHalfWidth, maxX = W / 2 + CFG.bowlHalfWidth, minY = GROUND_Y - 150, maxY = GROUND_Y + 60;
  for (const sh of peakShot) for (const poly of sh.polys) for (const [x, y] of poly) {
    minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y);
  }
  const k = Math.min(area.w / (maxX - minX), area.h / (maxY - minY), maxK);
  const ox = area.x + (area.w - (maxX - minX) * k) / 2 - minX * k, oy = area.y + area.h - maxY * k;
  const X = x => ox + x * k, Y = y => oy + y * k;
  g.lineWidth = lw; g.lineJoin = 'round'; g.strokeStyle = T().line;
  // お椀
  g.fillStyle = T().bowl; g.beginPath();
  bowlPts.forEach((p, i) => i ? g.lineTo(X(p.x), Y(p.y)) : g.moveTo(X(p.x), Y(p.y)));
  const bl = bowlPts[bowlPts.length - 1], bf = bowlPts[0];
  g.lineTo(X(bl.x), Y(bl.y + 30)); g.lineTo(X(bf.x), Y(bf.y + 30)); g.closePath(); g.fill(); g.stroke();
  // ピース
  for (const sh of peakShot) {
    g.fillStyle = sh.color;
    for (const poly of sh.polys) {
      g.beginPath(); poly.forEach(([x, y], i) => i ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y)));
      g.closePath(); g.fill(); g.stroke();
    }
  }
}

function step() {
  if (state === 'play' || state === 'over') {
    Engine.update(engine, 1000 / 60);
    // 落下速度に上限をかけて、着地の衝撃を抑える
    for (const p of pieces) {
      if (p.velocity.y > CFG.maxFallSpeed) Body.setVelocity(p, { x: p.velocity.x, y: CFG.maxFallSpeed });
    }
    // 落下判定
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      if (p.position.y > GROUND_Y + 350) {
        Composite.remove(engine.world, p);
        pieces.splice(i, 1);
        if (p === current) { current = null; if (state === 'play') { miss(); if (state === 'play') spawn(); } }
        else if (state === 'play') miss();
      }
    }
    if (state === 'play') {
      const st = towerStats();
      if (st.h !== score || st.n !== count) {
        score = st.h; count = st.n;
        if (score > peakScore) recordPeak();
        peakScore = Math.max(peakScore, score); peakCount = Math.max(peakCount, count);
        updateHud();
      }
      // 次のピース投入判定
      if (current) {
        if (settled(current)) settleCount++; else settleCount = 0;
        if (settleCount > CFG.settleFrames || performance.now() - droppedAt > CFG.maxWaitMs) {
          current = null;
          Sound.stack(count);
          if (!bossPending && score >= nextBoss) { bossPending = true; showWarning(); spawnDelay = CFG.warnFrames; }
          else spawn();
        }
      }
      // 注意の帯を見せてから変な物体を出す
      if (!held && !current && spawnDelay > 0 && --spawnDelay === 0) spawn();
    }
    // カメラ
    targetScale = viewScale(score * 2 * CFG.block);   // 高さ(m)をワールド単位に戻す
    scale += (targetScale - scale) * 0.05;
    if (held) Body.setPosition(held, { x: held.position.x, y: topY() + 60 });
  }
}

function drawBody(b, color, alpha) {
  const parts = b.parts.length > 1 ? b.parts.slice(1) : [b];
  ctx.fillStyle = color; ctx.strokeStyle = T().line; ctx.lineWidth = Math.max(1.5, 2 * scale);
  ctx.globalAlpha = alpha;
  for (const p of parts) {
    ctx.beginPath();
    p.vertices.forEach((v, i) => i ? ctx.lineTo(sx(v.x), sy(v.y)) : ctx.moveTo(sx(v.x), sy(v.y)));
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  // 奈落の目印
  ctx.fillStyle = T().abyss; ctx.fillRect(0, sy(GROUND_Y + 30), cw, ch);
  ctx.fillStyle = T().bowl; ctx.strokeStyle = T().line; ctx.lineWidth = Math.max(1.5, 2 * scale);
  ctx.beginPath();
  bowlPts.forEach((p, i) => i ? ctx.lineTo(sx(p.x), sy(p.y)) : ctx.moveTo(sx(p.x), sy(p.y)));
  const bl = bowlPts[bowlPts.length - 1], bf = bowlPts[0];
  ctx.lineTo(sx(bl.x), sy(bl.y + 30)); ctx.lineTo(sx(bf.x), sy(bf.y + 30));
  ctx.closePath(); ctx.fill(); ctx.stroke();
  for (const p of pieces) drawBody(p, p.color, 1);
  if (held) {
    drawBody(held, held.color, 0.85);
    // 落下位置のガイド線
    ctx.strokeStyle = T().guide; ctx.setLineDash([4, 6]); ctx.beginPath();
    // 現在の向きでの左端・右端から真下に2本(Matterが持っている外接矩形を使うので計算は軽い)
    for (const x of [held.bounds.min.x, held.bounds.max.x]) {
      ctx.moveTo(sx(x), sy(held.bounds.max.y)); ctx.lineTo(sx(x), sy(GROUND_Y));
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

let last = 0, acc = 0;
function loop(t) {
  const dt = Math.min(100, t - last); last = t; acc += dt;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}

// ===== 音(Web Audio。ファイルなしで合成する) =====
const Sound = {
  ctx: null, master: null, noiseBuf: null, muted: safeGet('bff-mute') === '1', ad: false, lastHit: 0,
  VOL: 0.6,
  unlock() {                       // スマホは最初の操作のあとでないと音が出せない
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      this.noiseBuf = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.applyGain();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  applyGain() { if (this.master) this.master.gain.value = (this.muted || this.ad) ? 0 : this.VOL; },
  setMuted(m) { this.muted = m; this.applyGain(); safeSet('bff-mute', m ? '1' : '0'); $('mute').textContent = m ? '🔇' : '🔊'; },
  adPlaying(b) { this.ad = b; this.applyGain(); },       // 広告の再生中は鳴らさない
  ok() { return this.ctx && this.ctx.state === 'running'; },

  tone(f0, dur, o = {}) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f0, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.3, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + dur + 0.03);
  },
  noise(dur, vol, freq, delay = 0) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + delay;
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noiseBuf; f.type = 'bandpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.03);
  },

  // ぶつかった強さで、音の大きさと低さが変わる
  collide(pairs) {
    if (!this.ok()) return;
    const now = this.ctx.currentTime;
    if (now - this.lastHit < 0.04) return;           // 連続しすぎると耳障りなので間引く
    let vmax = 0;
    for (const p of pairs) {
      const a = p.collision ? p.collision.parentA : p.bodyA, b = p.collision ? p.collision.parentB : p.bodyB;
      vmax = Math.max(vmax, Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y));
    }
    if (vmax < 1.2) return;
    this.lastHit = now;
    const k = Math.min(1, vmax / 9);
    this.tone(210 - k * 90 + Math.random() * 25, 0.09 + k * 0.08, { type: 'triangle', vol: 0.1 + k * 0.35, to: 70 });
    this.noise(0.05 + k * 0.05, 0.04 + k * 0.2, 900);
  },
  drop() { this.tone(720, 0.13, { to: 240, vol: 0.14 }); this.noise(0.1, 0.06, 3000); },
  // 積むたびに音が上がる(ペンタトニック)。崩れて個数が減ると、音も下がる
  stack(n) {
    const i = Math.min(14, Math.max(0, n - 1)), deg = [0, 2, 4, 7, 9];
    const semi = deg[i % 5] + 12 * Math.floor(i / 5), f = 261.63 * Math.pow(2, semi / 12);
    this.tone(f, 0.28, { vol: 0.2 });
    this.tone(f * 2, 0.2, { type: 'triangle', vol: 0.07 });
  },
  miss() { this.tone(420, 0.45, { type: 'square', to: 90, vol: 0.1 }); this.tone(300, 0.4, { to: 60, vol: 0.2, delay: 0.05 }); },
  warning() {                                       // 「ぎゅいーん ぎゅいーん」: 低い音から一気に上がる音を3回
    if (!this.ok()) return;
    const c = this.ctx, t0 = c.currentTime;
    for (let i = 0; i < 3; i++) {
      const t = t0 + i * 0.58;
      for (const detune of [0, 14]) {                // 少しずらした2つを重ねて、ざらついた太い音にする
        const osc = c.createOscillator(), g = c.createGain();
        osc.type = 'sawtooth'; osc.detune.value = detune;
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.exponentialRampToValueAtTime(1100, t + 0.45);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.065, t + 0.05);
        g.gain.setValueAtTime(0.065, t + 0.38);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.52);
        osc.connect(g); g.connect(this.master); osc.start(t); osc.stop(t + 0.56);
      }
    }
  },
  boss() { this.tone(80, 0.7, { type: 'sawtooth', to: 38, vol: 0.35 }); this.noise(0.4, 0.2, 200); },
  over() { this.noise(0.5, 0.25, 220); this.tone(220, 0.9, { type: 'sawtooth', to: 50, vol: 0.14 }); },
  revive() { this.tone(200, 0.35, { type: 'triangle', to: 900, vol: 0.18 }); this.tone(1200, 0.3, { vol: 0.14, delay: 0.32 }); }
};
['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(ev => window.addEventListener(ev, () => Sound.unlock(), { passive: true }));
$('mute').addEventListener('click', () => Sound.setMuted(!Sound.muted));
$('mute').textContent = Sound.muted ? '🔇' : '🔊';

resize();
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
